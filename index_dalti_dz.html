<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--navy:#062c55;--blue:#0878d1;--green:#08c66f;--bg:#f5f8fc;--ink:#10233d;--muted:#718096;--card:#fff;--danger:#ef4444;--shadow:0 12px 30px #062c5512}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}.top{background:linear-gradient(145deg,#062c55,#07578b);color:#fff;padding:24px 18px 20px;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;color:var(--green);font-size:22px;font-weight:900}.brand b{font-size:22px;letter-spacing:.3px}.brand span{display:block;font-size:12px;color:#cde6ff;margin-top:3px}.hello{margin-top:22px;font-size:23px;font-weight:800}.search{margin-top:15px;background:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:8px;box-shadow:var(--shadow)}.search input{border:0;outline:0;width:100%;font-size:14px}.content{padding:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.section-title h2{font-size:17px;margin:0}.section-title a{font-size:12px;color:var(--blue)}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{border:0;background:#fff;border-radius:16px;padding:12px 5px;box-shadow:var(--shadow);color:var(--ink);font-size:11px}.cat i{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;margin:0 auto 7px;background:#eaf5ff;font-style:normal;font-size:20px}.business{background:#fff;border-radius:18px;padding:12px;margin-bottom:11px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}.pic{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#0b6cae,#08c66f);display:grid;place-items:center;color:#fff;font-size:28px}.bizmain{flex:1}.bizmain b{font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.status{display:inline-block;margin-top:7px;background:#e7fff3;color:#05854b;border-radius:20px;padding:4px 8px;font-size:10px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#04361f}.secondary{background:#edf6ff;color:#075b99}.full{width:100%}.ticket{background:linear-gradient(145deg,#062c55,#0b5f91);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}.ticket small{color:#cde6ff}.ticket .num{font-size:55px;font-weight:900;color:#4df19e;text-align:center;margin:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff14;border:1px solid #ffffff18;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:18px;margin-top:4px}.notice{margin-top:12px;background:#eff9ff;color:#075b99;border-radius:14px;padding:12px;font-size:12px}.panel{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.row:last-child{border:0}.pill{padding:5px 9px;border-radius:20px;font-size:10px;background:#e8fff4;color:#07844c}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;height:72px;background:#fff;border-top:1px solid #e7edf3;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:none;color:#8090a5;font-size:11px}.nav button.active{color:#0878d1;font-weight:800}.nav span{display:block;font-size:21px;margin-bottom:3px}.hidden{display:none!important}.back{border:0;background:none;color:#fff;font-size:24px}#map{height:300px;border-radius:18px;overflow:hidden;border:1px solid #e4ebf2}.distance{font-size:11px;color:var(--blue);font-weight:800}.nearby-tools{display:flex;gap:8px;margin-top:10px}.nearby-tools .btn{flex:1}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#062c55;color:#fff;padding:11px 16px;border-radius:13px;z-index:50;box-shadow:var(--shadow);font-size:12px}
.splash{position:fixed;inset:0;background:linear-gradient(145deg,#062c55,#0878d1);color:#fff;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center}.splash-logo{width:88px;height:88px;border-radius:28px;background:#fff;color:#08c66f;display:grid;place-items:center;font-size:43px;font-weight:900;box-shadow:0 20px 50px #001b332e}.splash-title{font-size:30px;font-weight:900;margin-top:18px;letter-spacing:1px}.splash-title span{color:#4df19e}.splash-sub{font-size:14px;color:#d8efff;margin-top:5px}.splash-loader{width:110px;height:4px;background:#ffffff25;border-radius:9px;margin-top:25px;overflow:hidden}.splash-loader i{display:block;width:45%;height:100%;background:#4df19e;border-radius:9px;animation:load 1.2s infinite ease-in-out}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
@media(min-width:700px){body{padding:20px}.app{border-radius:28px;overflow:hidden;box-shadow:0 20px 70px #062c5520}}
</style></head>
<body><div id="splash" class="splash"><div class="splash-logo">⌛</div><div class="splash-title">DOURI <span>DZ</span></div><div class="splash-sub">دورك بدون انتظار</div><div class="splash-loader"><i></i></div></div><div class="app" id="app"></div><div id="toast" class="toast hidden"></div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xkwyftkytdxhfguljerr.supabase.co';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const sb=(SUPABASE_URL.startsWith('http')&&SUPABASE_ANON_KEY.startsWith('ey'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const deviceId=localStorage.getItem('dalti_device')||crypto.randomUUID(); localStorage.setItem('dalti_device',deviceId);
const savedTicket=JSON.parse(localStorage.getItem('dalti_ticket')||'null');
const state={notifyThreshold:3,merchantOpen:true,screen:localStorage.getItem('dalti_phone_verified')==='true'?(savedTicket?'ticket':'home'):'auth',ticket:savedTicket?.ticket_number||null,ticketBusiness:savedTicket?.business_id||null,waiting:savedTicket?.people_ahead||18,merchantQueue:[],live:false,channel:null,role:localStorage.getItem('dalti_role')||'guest',merchantBusiness:null,businessLocation:null};
const businesses=[['🍔','مطعم مذاق الجزائر','مطعم','الجزائر','4.5','طابور مفتوح','00000000-0000-0000-0000-000000000001'],['🍟','Fast Food الجيل','مطعم','الجزائر','4.3','طابور مفتوح','00000000-0000-0000-0000-000000000002'],['✂️','صالون الحلقة الأنيق','حلاق','الجزائر','4.8','طابور مفتوح','00000000-0000-0000-0000-000000000003'],['⚕️','عيادة الحياة','عيادة','الجزائر','4.2','الطابور مغلق','00000000-0000-0000-0000-000000000004']];
let userLocation=null, map=null, mapMarkers=[];
const fallbackCoords={
 '00000000-0000-0000-0000-000000000001':[36.7525,3.0420],
 '00000000-0000-0000-0000-000000000002':[36.7460,3.0600],
 '00000000-0000-0000-0000-000000000003':[36.7400,3.0550],
 '00000000-0000-0000-0000-000000000004':[36.7600,3.0500]
};
function initMap(){
  if(!document.getElementById('map')||typeof L==='undefined') return;
  if(map){map.invalidateSize();return;}
  map=L.map('map',{zoomControl:true}).setView([36.7538,3.0588],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  loadNearby();
}
function locateMe(){
  if(!navigator.geolocation){showToast('الموقع غير متاح على هذا الجهاز');return;}
  document.getElementById('locStatus').textContent='جارٍ تحديد الموقع…';
  navigator.geolocation.getCurrentPosition(pos=>{
    userLocation=[pos.coords.latitude,pos.coords.longitude];
    document.getElementById('locStatus').textContent='تم تحديد موقعك';
    if(map){map.setView(userLocation,14);L.marker(userLocation).addTo(map).bindPopup('موقعك الحالي').openPopup();}
    loadNearby();
  },()=>{document.getElementById('locStatus').textContent='تعذر تحديد الموقع';showToast('اسمح للتطبيق باستخدام الموقع');},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function haversine(a,b){const R=6371,rad=Math.PI/180,dLat=(b[0]-a[0])*rad,dLon=(b[1]-a[1])*rad;const x=Math.sin(dLat/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function businessCoords(id,b){return (b.latitude&&b.longitude)?[Number(b.latitude),Number(b.longitude)]:fallbackCoords[id]||[36.7538,3.0588];}
async function loadNearby(){
  if(!document.getElementById('map')) return;
  let list=[];
  if(sb){const r=await sb.from('businesses').select('id,name,category,city,is_open,latitude,longitude,address').eq('is_open',true).limit(30);if(!r.error)list=r.data||[];}
  if(!list.length) list=businesses.map(x=>({id:x[6],name:x[1],category:x[2],city:x[3],is_open:true,latitude:fallbackCoords[x[6]]?.[0],longitude:fallbackCoords[x[6]]?.[1],address:x[3]}));
  const enriched=list.map(b=>{const c=businessCoords(b.id,b);return {...b,coords:c,distance:userLocation?haversine(userLocation,c):null};}).sort((a,b)=>(a.distance??999)-(b.distance??999));
  if(map){mapMarkers.forEach(m=>m.remove());mapMarkers=[];enriched.forEach(b=>{const m=L.marker(b.coords).addTo(map).bindPopup(`<b>${esc(b.name)}</b><br>${esc(b.category||'')}<br>${b.distance!=null?b.distance.toFixed(1)+' كم':''}`);mapMarkers.push(m);});}
  const box=document.getElementById('nearbyList'); if(box)box.innerHTML=enriched.slice(0,4).map(b=>`<div class="business"><div class="pic">📍</div><div class="bizmain"><b>${esc(b.name)}</b><div class="meta">${esc(b.category||'')} — ${esc(b.city||'')}</div><span class="status">${b.distance!=null?b.distance.toFixed(1)+' كم':'نشاط قريب'}</span></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn primary" onclick="takeRemoteTicket('${b.id}','${encodeURIComponent(b.name)}')">أخذ دور</button><button class="btn secondary" onclick="openDirections(${b.coords[0]},${b.coords[1]})">الخريطة</button></div></div>`).join('');
}
function openDirections(lat,lng){window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,'_blank');}
function render(){const a=document.getElementById('app'); a.innerHTML= state.screen==='auth'?auth():state.screen==='home'?home():state.screen==='ticket'?ticket():state.screen==='merchant'?merchantGate():state.screen==='register'?register():state.screen==='admin'?adminPanel():state.screen==='history'?historyScreen():businessesPage(); if(!['auth','merchant'].includes(state.screen)) nav(); if(state.screen==='merchant' && sb && !state.live) initLive();}

function auth(){return `<header class="top"><div class="brand"><div class="logo">📱</div><div><b>DOURI <span style="color:#19dc83">DZ</span></b><span>تسجيل آمن برقم الهاتف</span></div></div><div class="hello">أنشئ حسابك أو ادخل إلى حسابك</div></header><main class="content"><div class="panel"><div class="meta" style="margin-bottom:12px">سنرسل رمز تحقق SMS إلى رقم هاتفك. استخدم رقمًا بصيغة دولية، مثل +213XXXXXXXXX.</div><input id="phone" inputmode="tel" placeholder="+213 5xx xx xx xx" style="width:100%;padding:13px;border:1px solid #dde6ef;border-radius:12px"><button class="btn primary full" style="margin-top:12px" onclick="sendOtp()">إرسال رمز SMS</button><div id="otpBox" class="hidden" style="margin-top:14px"><input id="otp" inputmode="numeric" maxlength="6" placeholder="رمز التحقق 6 أرقام" style="width:100%;padding:13px;border:1px solid #dde6ef;border-radius:12px;text-align:center;letter-spacing:6px"><button class="btn secondary full" style="margin-top:10px" onclick="verifyOtp()">تأكيد الرمز</button></div><div class="notice" style="margin-top:14px">🔒 رقم الهاتف يستخدم لتأكيد ملكية الحساب، ولا يعني وحده اعتماد النشاط التجاري.</div></div></main>`}
function normalizePhone(v){v=v.trim().replace(/[\s()-]/g,''); if(v.startsWith('05')) v='+213'+v.slice(1); if(v.startsWith('06')) v='+213'+v.slice(1); if(v.startsWith('07')) v='+213'+v.slice(1); return v}
async function sendOtp(){const phone=normalizePhone(document.getElementById('phone').value); if(!/^\+213[5-7]\d{8}$/.test(phone)){showToast('أدخل رقمًا جزائريًا صحيحًا مثل +2135XXXXXXXX');return} if(!sb){localStorage.setItem('dalti_demo_phone',phone);document.getElementById('otpBox').classList.remove('hidden');showToast('الوضع التجريبي: استخدم 123456');return} try{const {error}=await sb.auth.signInWithOtp({phone,options:{shouldCreateUser:true}});if(error)throw error;localStorage.setItem('dalti_phone_pending',phone);document.getElementById('otpBox').classList.remove('hidden');showToast('تم إرسال رمز SMS')}catch(e){console.error(e);showToast('تعذر إرسال رمز SMS — تأكد من تفعيل SMS في Supabase')}}
async function verifyOtp(){const otp=document.getElementById('otp').value.trim();const phone=localStorage.getItem('dalti_phone_pending')||localStorage.getItem('dalti_demo_phone');if(!/^\d{6}$/.test(otp)){showToast('أدخل رمزًا من 6 أرقام');return} if(!sb){if(otp!=='123456'){showToast('في الوضع التجريبي الرمز هو 123456');return} localStorage.setItem('dalti_phone_verified','true');state.screen='home';render();showToast('تم تأكيد رقم الهاتف ✓');return} try{const {data,error}=await sb.auth.verifyOtp({phone,token:otp,type:'sms'});if(error)throw error;localStorage.setItem('dalti_phone_verified','true');localStorage.removeItem('dalti_phone_pending');state.screen='home';render();showToast('تم تأكيد رقم الهاتف ✓')}catch(e){console.error(e);showToast('رمز التحقق غير صحيح أو انتهت صلاحيته')}}
async function signOut(){if(sb) await sb.auth.signOut(); localStorage.removeItem('dalti_phone_verified'); localStorage.removeItem('dalti_phone_pending'); state.screen='auth';render();showToast('تم تسجيل الخروج')}

function home(){return `<header class="top"><div class="brand"><div class="logo">👥</div><div><b>DOURI <span style="color:#19dc83">DZ</span></b><span>دورك بدون انتظار</span></div></div><div class="hello">خذ دورك من هاتفك 📱</div><div class="search">🔎<input placeholder="ابحث عن محل أو خدمة..." oninput="filterBiz(this.value)"></div></header><main class="content"><div class="panel"><div class="section-title"><h2>📍 الأنشطة القريبة منك</h2><span class="distance" id="locStatus">الموقع غير محدد</span></div><div id="map"></div><div class="nearby-tools"><button class="btn secondary" onclick="locateMe()">📍 تحديد موقعي</button><button class="btn secondary" onclick="loadNearby()">🔄 تحديث القريب</button></div><div id="nearbyList" style="margin-top:10px"></div></div><div class="panel"><div class="section-title"><h2>ابدأ باستخدام Dalti DZ</h2></div><div class="meta">خذ رقمك من هاتفك أو سجّل نشاطك لإدارة طوابير الزبائن.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn secondary" onclick="chooseRole('customer')">👤 أنا زبون</button><button class="btn primary" onclick="chooseRole('merchant')">🏪 أنا صاحب نشاط</button><button class="btn secondary" onclick="go('admin')" style="grid-column:1/-1">🛡️ لوحة الإدارة</button></div></div><div class="section-title"><h2>الخدمات</h2><a>عرض الكل</a></div><div class="cats"><button class="cat" onclick="businessesScreen()"><i>🍔</i>مطاعم</button><button class="cat" onclick="businessesScreen()"><i>✂️</i>حلاقين</button><button class="cat" onclick="businessesScreen()"><i>⚕️</i>عيادات</button><button class="cat" onclick="businessesScreen()"><i>🏨</i>فنادق</button></div><div class="section-title" style="margin-top:22px"><h2>المحلات القريبة</h2><a onclick="businessesScreen()">عرض الكل</a></div><div id="bizlist">${businessList(businesses.slice(0,3))}</div></main>`}
function businessList(list){return list.map((b,i)=>`<div class="business"><div class="pic">${b[0]}</div><div class="bizmain"><b>${b[1]}</b><div class="meta">${b[2]} · ${b[3]} · ⭐ ${b[4]}</div><span class="status">${b[5]}</span></div><button class="btn secondary" onclick="${i===3?'':'takeTicket('+i+')'}">${i===3?'مغلق':'أخذ دور'}</button></div>`).join('')}
function businessesPage(){return `<header class="top"><button class="back" onclick="go('home')">‹</button><div style="font-size:20px;font-weight:800">المحلات والخدمات</div></header><main class="content">${businessList(businesses)}</main>`}
function ticket(){if(!state.ticket)return home();return `<header class="top"><button class="back" onclick="go('home')">‹</button><div style="font-size:20px;font-weight:800">دوري الحالي</div></header><main class="content"><div class="ticket"><small>${state.ticketBusinessName||'نشاط تجاري'}</small><div class="num">A ${state.ticket}</div><div class="stats"><div class="stat">👥<small>الأشخاص قبلك</small><b>${Math.max(0,state.ticket-12)}</b></div><div class="stat">⏱️<small>الانتظار المتوقع</small><b>${state.waiting} د</b></div></div><div class="notice">📍 يمكنك البقاء خارج المكان. سنحدّث دورك تلقائيًا، وننبهك عندما يقترب موعد الخدمة.</div></div><button class="btn secondary full" style="margin-top:12px" onclick="requestNotifications()">🔔 تفعيل تنبيهات اقتراب الدور</button><button class="btn secondary full" style="margin-top:8px" onclick="cancelTicket()">إلغاء دوري</button></main>`}
async function merchantGate(){
  let status=localStorage.getItem('dalti_verification_status')||'none';
  if(sb){ try { const {data}=await sb.rpc('merchant_dashboard_access'); if(data?.status){ status=data.status; localStorage.setItem('dalti_verification_status',status); state.merchantBusiness=data.business_id||localStorage.getItem('dalti_merchant_business'); } } catch(e){ console.warn(e); } }
  if(status==='approved') return merchant();
  if(status==='pending') return `<header class="top"><div class="brand"><button class="back" onclick="go('home')">‹</button><div><b>DOURI <span style="color:#19dc83">DZ</span></b><span>توثيق صاحب النشاط</span></div></div><div class="hello">حسابك قيد المراجعة ⏳</div></header><main class="content"><div class="panel"><div style="font-size:42px;text-align:center">🕐</div><h2 style="text-align:center">طلبك قيد المراجعة</h2><div class="meta" style="text-align:center">تم استلام بيانات النشاط وبطاقة الهوية. لن تتمكن من إدارة الطابور حتى تتم الموافقة من الإدارة.</div><button class="btn secondary full" style="margin-top:14px" onclick="refreshVerification()">تحديث حالة التحقق</button><button class="btn full" style="margin-top:8px;background:#f1f5f9" onclick="signOut()">تسجيل الخروج</button></div></main>`;
  return `<header class="top"><div class="brand"><button class="back" onclick="go('home')">‹</button><div><b>DOURI <span style="color:#19dc83">DZ</span></b><span>صاحب نشاط</span></div></div><div class="hello">وثّق نشاطك للبدء</div></header><main class="content"><div class="panel"><div class="meta">يجب إرسال بيانات النشاط وصورة بطاقة الهوية. بعد موافقة الإدارة ستفتح لوحة التحكم تلقائيًا.</div><button class="btn primary full" style="margin-top:14px" onclick="go('register')">بدء التوثيق</button></div></main>`;
}
async function refreshVerification(){
 if(!sb){showToast('الوضع التجريبي: لا يمكن فحص الخادم');return}
 const {data,error}=await sb.rpc('get_my_verification_status');
 if(error){showToast('تعذر تحديث حالة التحقق');return}
 const st=data?.status||'none'; localStorage.setItem('dalti_verification_status',st);
 if(st==='approved'){showToast('تم قبول نشاطك ✓'); render();} else if(st==='rejected'){showToast('تم رفض الطلب، يمكنك إعادة التسجيل'); localStorage.removeItem('dalti_verification_status'); render();} else showToast('ما زال الطلب قيد المراجعة');
}
