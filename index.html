<!doctype html>
<html lang="ar" dir="rtl">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "aebc70be-6ec2-4393-93c8-969420aa6cc7",
    });
  });
</script>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062c55"><meta name="description" content="Douri DZ — دورك بدون انتظار">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Douri DZ — دورك بدون انتظار</title>
<style>
:root{--navy:#062c55;--blue:#0878d1;--green:#08c66f;--bg:#f5f8fc;--ink:#10233d;--muted:#718096;--card:#fff;--danger:#ef4444;--shadow:0 12px 30px #062c5512}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}.top{background:linear-gradient(145deg,#062c55,#07578b);color:#fff;padding:24px 18px 20px;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;color:var(--green);font-size:22px;font-weight:900}.brand b{font-size:22px;letter-spacing:.3px}.brand span{display:block;font-size:12px;color:#cde6ff;margin-top:3px}.hello{margin-top:22px;font-size:23px;font-weight:800}.search{margin-top:15px;background:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:8px;box-shadow:var(--shadow)}.search input{border:0;outline:0;width:100%;font-size:14px}.content{padding:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.section-title h2{font-size:17px;margin:0}.section-title a{font-size:12px;color:var(--blue)}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{border:0;background:#fff;border-radius:16px;padding:12px 5px;box-shadow:var(--shadow);color:var(--ink);font-size:11px}.cat i{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;margin:0 auto 7px;background:#eaf5ff;font-style:normal;font-size:20px}.business{background:#fff;border-radius:18px;padding:12px;margin-bottom:11px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}.pic{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#0b6cae,#08c66f);display:grid;place-items:center;color:#fff;font-size:28px}.bizmain{flex:1}.bizmain b{font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.status{display:inline-block;margin-top:7px;background:#e7fff3;color:#05854b;border-radius:20px;padding:4px 8px;font-size:10px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#04361f}.secondary{background:#edf6ff;color:#075b99}.full{width:100%}.ticket{background:linear-gradient(145deg,#062c55,#0b5f91);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}.ticket small{color:#cde6ff}.ticket .num{font-size:55px;font-weight:900;color:#4df19e;text-align:center;margin:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff14;border:1px solid #ffffff18;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:18px;margin-top:4px}.notice{margin-top:12px;background:#eff9ff;color:#075b99;border-radius:14px;padding:12px;font-size:12px}.panel{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.row:last-child{border:0}.pill{padding:5px 9px;border-radius:20px;font-size:10px;background:#e8fff4;color:#07844c}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;height:72px;background:#fff;border-top:1px solid #e7edf3;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:none;color:#8090a5;font-size:11px}.nav button.active{color:#0878d1;font-weight:800}.nav span{display:block;font-size:21px;margin-bottom:3px}.hidden{display:none!important}.back{border:0;background:none;color:#fff;font-size:24px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#062c55;color:#fff;padding:11px 16px;border-radius:13px;z-index:50;box-shadow:var(--shadow);font-size:12px}
@media(min-width:700px){body{padding:20px}.app{border-radius:28px;overflow:hidden;box-shadow:0 20px 70px #062c5520}}
</style>
</head>
<body>...<div class="app" id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const state={screen:'home',ticket:null,queue:12,waiting:18,merchantQueue:[14,15,16,17,18,19]};
const businesses=[['🍔','مطعم مذاق الجزائر','مطعم','1.2 كم','4.5','طابور مفتوح'],['🍟','Fast Food الجيل','مطعم','1.5 كم','4.3','طابور مفتوح'],['✂️','صالون الحلقة الأنيق','حلاق','350 م','4.8','طابور مفتوح'],['⚕️','عيادة الحياة','عيادة','1.8 كم','4.2','الطابور مغلق']];
function render(){const a=document.getElementById('app'); a.innerHTML= state.screen==='home'?home():state.screen==='ticket'?ticket():state.screen==='merchant'?merchant():businessesPage(); if(state.screen!=='merchant') nav();}
function home(){return `<header class="top"><div class="brand"><div class="logo">👥</div><div><b>DOURI <span style="color:#19dc83">DZ</span></b><span>دورك بدون انتظار</span></div></div><div class="hello">خذ دورك من هاتفك 📱</div><div class="search">🔎<input placeholder="ابحث عن محل أو خدمة..." oninput="filterBiz(this.value)"></div></header><main class="content"><div class="section-title"><h2>الخدمات</h2><a>عرض الكل</a></div><div class="cats"><button class="cat" onclick="businessesScreen()"><i>🍔</i>مطاعم</button><button class="cat" onclick="businessesScreen()"><i>✂️</i>حلاقين</button><button class="cat" onclick="businessesScreen()"><i>⚕️</i>عيادات</button><button class="cat" onclick="businessesScreen()"><i>🏨</i>فنادق</button></div><div class="section-title" style="margin-top:22px"><h2>المحلات القريبة</h2><a onclick="businessesScreen()">عرض الكل</a></div><div id="bizlist">${businessList(businesses.slice(0,3))}</div></main>`}
function businessList(list){return list.map((b,i)=>`<div class="business"><div class="pic">${b[0]}</div><div class="bizmain"><b>${b[1]}</b><div class="meta">${b[2]} · ${b[3]} · ⭐ ${b[4]}</div><span class="status">${b[5]}</span></div><button class="btn secondary" onclick="${i===3?'':'takeTicket('+i+')'}">${i===3?'مغلق':'أخذ دور'}</button></div>`).join('')}
function businessesPage(){return `<header class="top"><button class="back" onclick="go('home')">‹</button><div style="font-size:20px;font-weight:800">المحلات والخدمات</div></header><main class="content">${businessList(businesses)}</main>`}
function ticket(){if(!state.ticket)return home();return `<header class="top"><button class="back" onclick="go('home')">‹</button><div style="font-size:20px;font-weight:800">دوري الحالي</div></header><main class="content"><div class="ticket"><small>مطعم مذاق الجزائر</small><div class="num">A ${state.ticket}</div><div class="stats"><div class="stat">👥<small>الأشخاص قبلك</small><b>${Math.max(0,state.ticket-12)}</b></div><div class="stat">⏱️<small>الانتظار المتوقع</small><b>${state.waiting} د</b></div></div><div class="notice">🔔 سنرسل لك إشعارًا عندما يقترب دورك. يمكنك متابعة الطابور من هاتفك.</div></div><button class="btn secondary full" style="margin-top:12px" onclick="cancelTicket()">إلغاء دوري</button></main>`}
function merchant(){return `<header class="top"><div class="brand"><div class="logo">🏪</div><div><b>لوحة التحكم</b><span>صاحب النشاط التجاري</span></div></div></header><main class="content"><div class="panel"><div class="section-title"><h2>الطابور الحالي</h2><span class="pill">مفتوح</span></div><div style="font-size:45px;font-weight:900;text-align:center;color:#0878d1">A ${state.merchantQueue[0]||'—'}</div><button class="btn primary full" onclick="nextCustomer()">استدعاء التالي ▶</button></div><div class="panel"><div class="section-title"><h2>المنتظرون</h2><span>${state.merchantQueue.length} أشخاص</span></div>${state.merchantQueue.map((n,i)=>`<div class="row"><b>A ${n}</b><span class="pill">${i===0?'جاري':'في الانتظار'}</span></div>`).join('')}</div><button class="btn secondary full" onclick="showToast('تم إغلاق الطابور مؤقتًا')">إغلاق الطابور</button></main>`}
function nav(){document.body.insertAdjacentHTML('beforeend','<nav class="nav"><button class="active" onclick="go(\'home\')"><span>⌂</span>الرئيسية</button><button onclick="businessesScreen()"><span>⌕</span>بحث</button><button onclick="go(\'ticket\')"><span>🎫</span>دوري</button><button onclick="go(\'merchant\')"><span>🏪</span>نشاطي</button></nav>');}
function go(s){document.querySelector('.nav')?.remove();state.screen=s;render()}
function businessesScreen(){go('businesses')}
function takeTicket(i){state.ticket=15;state.waiting=18;state.screen='ticket';render();showToast('تم أخذ دورك بنجاح 🎫')}
function cancelTicket(){state.ticket=null;go('home');showToast('تم إلغاء دورك')}
function nextCustomer(){if(state.merchantQueue.length){state.merchantQueue.shift();showToast('تم استدعاء العميل التالي');render()}else showToast('لا يوجد عملاء منتظرون')}
function filterBiz(q){const list=businesses.filter(b=>b[1].includes(q)||b[2].includes(q));document.getElementById('bizlist').innerHTML=businessList(list.slice(0,4))}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2200)}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
